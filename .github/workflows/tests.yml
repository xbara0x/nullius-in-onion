# Offline unit tests on every push and pull request — no Tor daemon involved.
# Three jobs: the tests across Python versions, a quality gate (lint + types +
# coverage), and a proof that the package installs and the console script runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .[dev]
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .[descriptor]
      - run: nullius --version
      - run: nullius --help
