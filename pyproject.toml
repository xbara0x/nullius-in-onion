[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nullius-in-onion"
dynamic = ["version"]
description = "Take nobody's word for it — not the index's, not the server's, not this tool's. Is a .onion up, who already lists it, what changed since last time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "xbara0x", email = "xbara0x@pm.me" }]
keywords = ["tor", "onion", "dark-web", "osint", "threat-intelligence", "liveness-check"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "requests[socks]>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# --descriptor: ask the Tor control port whether an offline onion is still published
descriptor = ["stem>=1.8"]

[project.urls]
Homepage = "https://github.com/xbara0x/nullius-in-onion"
Changelog = "https://github.com/xbara0x/nullius-in-onion/blob/main/CHANGELOG.md"
Issues = "https://github.com/xbara0x/nullius-in-onion/issues"

[project.scripts]
nullius = "nullius:main"

[tool.setuptools]
py-modules = ["nullius"]
# The registry travels with an installed copy too: nullius looks for it under
# sys.prefix/share/nullius when there is no indices/ next to the module.
data-files = { "share/nullius" = ["indices/sources.txt", "indices/sources-health.json"] }

[tool.setuptools.dynamic]
version = { attr = "nullius.__version__" }
